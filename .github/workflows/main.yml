name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir la versión más reciente
        run: |
          ZIP=$(ls Reproductor_version_*.zip | sort -V | tail -n 1)
          echo "Usando $ZIP"
          unzip -o "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiPlaylist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
